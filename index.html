body{margin:0;min-height:100vh;color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;background:#7a0000 radial-gradient(circle at 85% 28%,#e8423f 0,#b01a1a 22%,#7a0000 50%,#2a0505 100%) fixed}
.wrap{max-width:440px;margin:auto;padding:18px 16px 130px}
.title{background:var(--glass);border:1px solid var(--ln);border-radius:40px;padding:12px 16px;text-align:center;font-weight:700;font-size:1.05rem;text-shadow:0 1px 4px rgba(0,0,0,.45);margin-bottom:22px;backdrop-filter:blur(6px)}
.item{background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.12));border:1px solid var(--ln);border-radius:36px;margin-bottom:12px;box-shadow:0 0 0 2px rgba(232,66,63,.28),0 6px 18px rgba(0,0,0,.25);overflow:hidden;transition:border-radius .25s}
.head{display:flex;align-items:center;gap:12px;width:100%;padding:7px 8px 7px 16px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:right}
.av{width:48px;height:48px;flex:none;border-radius:50%;border:1px solid var(--ln);background:rgba(255,255,255,.1);display:grid;place-items:center}
.av svg{width:22px;height:22px;fill:#fff}
.nm{flex:1;font-weight:700;font-size:1rem;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.bd{font-size:.75rem;background:rgba(0,0,0,.25);border-radius:99px;padding:1px 9px;font-weight:500}
.chev{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.75;transition:transform .25s}
.item.open{border-radius:28px}
.item.open .chev{transform:rotate(-90deg)}
.panel{display:none;padding:2px 16px 16px}
.item.open .panel{display:block}
.sec{margin-top:10px}
.sec b{display:flex;align-items:center;gap:6px;font-size:.8rem;opacity:.85;margin-bottom:6px;font-weight:500}
.sec b svg{width:15px;height:15px}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:block;direction:ltr;text-align:left;padding:8px 14px;border-radius:99px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links a:active{background:rgba(255,255,255,.2)}
.empty{text-align:center;opacity:.8;padding:30px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none}
.bar{pointer-events:auto;direction:ltr;width:min(448px,calc(100% - 24px));height:68px;display:flex;align-items:center;justify-content:space-around;background:rgba(90,8,8,.88);backdrop-filter:blur(10px);border:1px solid var(--ln);border-bottom:0;border-radius:36px 36px 0 0;position:relative;padding:0 6px}
.bar button{background:none;border:0;padding:10px;cursor:pointer;opacity:.55;transition:opacity .2s,transform .2s}
.bar button svg{width:26px;height:26px;fill:#fff;display:block}
.bar button.on{opacity:1;transform:translateY(-2px)}
.bar .home{width:50px;height:50px;border-radius:50%;margin-top:-34px;background:linear-gradient(145deg,#b02020,#6a0808);border:3px solid rgba(255,255,255,.55);display:grid;place-items:center;padding:0;opacity:1;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.bar .home.on{box-shadow:0 0 0 3px rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.45)}
.bar .home svg{width:24px;height:24px}
